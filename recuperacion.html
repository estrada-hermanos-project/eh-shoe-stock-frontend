<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Recuperación de contraseña | Estrada Hermanos</title>
  <meta name="description" content="Solicite un enlace para definir una contraseña nueva — Estrada Hermanos." />
  <link rel="icon" href="images/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login" id="login">
    <form class="login__card" id="recovery-form" method="post" action="javascript:void(0)" autocomplete="on">
      <img class="login__logo" src="images/logo.jpg" alt="Estrada Hermanos" />
      <p class="login__brand">Estrada Hermanos</p>
      <p class="login__tag">Calzado Fino de Occidente</p>
      <p class="login__panel-label">Recuperación de contraseña</p>
      <div class="field">
        <label for="user">Usuario</label>
        <input type="text" id="user" name="username" autocomplete="username" placeholder="diego.estrada" autofocus />
      </div>
      <p class="login__error" id="recovery-message" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit" id="recovery-submit">Enviar</button>
      <p class="login__hint">Use el usuario de cuenta, no el correo. Si existe, recibirá un enlace para definir una contraseña nueva.</p>
      <a class="login__back" href="acceso.html">Volver al acceso</a>
    </form>
  </div>
  <script type="module" src="js/recuperacion.js"></script>
</body>
</html>
