<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Acceso | Estrada Hermanos</title>
  <meta name="description" content="Acceso al panel de gestión para propietarios — Estrada Hermanos." />
  <link rel="icon" href="images/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login" id="login">
    <form class="login__card" id="login-form" method="post" action="javascript:void(0)" autocomplete="on">
      <img class="login__logo" src="images/logo.jpg" alt="Estrada Hermanos" />
      <p class="login__brand">Estrada Hermanos</p>
      <p class="login__tag">Calzado Fino de Occidente</p>
      <p class="login__panel-label">Panel de gestión · Acceso propietarios</p>
      <div class="field">
        <label for="user">Usuario</label>
        <input type="text" id="user" name="username" autocomplete="username" placeholder="diego.estrada" autofocus required />
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" name="password" autocomplete="current-password" required />
      </div>
      <p class="login__error" id="login-error" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit" id="login-submit">Ingresar al panel</button>
      <p class="login__hint">Use el usuario de cuenta, no el correo. Ejemplo: diego.estrada</p>
      <a class="login__back" href="index.html">Volver al sitio</a>
    </form>
  </div>
  <div class="toast-wrap" id="toast-wrap"></div>
  <script src="js/acceso.js"></script>
  <script>
    if (!window.__ehLoginBound)
    {
      document.getElementById("login-form").addEventListener("submit", function (event)
      {
        event.preventDefault();
      });
      document.getElementById("login-submit").addEventListener("click", async function ()
      {
        var errorEl = document.getElementById("login-error");
        var submit = document.getElementById("login-submit");
        var username = (document.getElementById("user").value || "").trim();
        var password = document.getElementById("pass").value || "";
        if (!username || !password)
        {
          errorEl.textContent = "Ingrese usuario y contraseña.";
          return;
        }
        var host = (location.hostname === "127.0.0.1" || location.hostname === "[::1]") ? "127.0.0.1" : "localhost";
        var apiBase = localStorage.getItem("eh.apiBase") || ("http://" + host + ":8080/api/v1");
        var tokenHeader = localStorage.getItem("eh.authToken") || "local-auth-token";
        submit.disabled = true;
        submit.textContent = "Ingresando…";
        errorEl.textContent = "";
        try
        {
          var response = await fetch(apiBase + "/auth/login", {
            method: "POST",
            headers: {
              Accept: "application/json",
              "Content-Type": "application/json",
              "auth-token": tokenHeader
            },
            body: JSON.stringify({ username: username, password: password })
          });
          var payload = await response.json().catch(function () { return {}; });
          if (!response.ok || !payload.data || !payload.data.token)
          {
            errorEl.textContent = payload.message === "Invalid credentials"
              ? "Usuario o contraseña incorrectos"
              : (payload.message || "No se pudo iniciar sesión.");
            return;
          }
          sessionStorage.setItem("eh.session", JSON.stringify({
            token: payload.data.token,
            username: username,
            at: Date.now()
          }));
          window.location.replace("app.html#/dashboard");
        }
        catch (err)
        {
          errorEl.textContent = "No se pudo conectar con el servidor. Verifique que el backend esté en marcha.";
        }
        finally
        {
          submit.disabled = false;
          submit.textContent = "Ingresar al panel";
        }
      });
    }
  </script>
</body>
</html>
