<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>Código de inicio de sesión | Estrada Hermanos</title>
  <meta name="description" content="Confirme el código de 4 dígitos para entrar al panel — Estrada Hermanos." />
  <link rel="icon" href="images/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="login" id="login">
    <form class="login__card" id="code-form" method="post" action="javascript:void(0)" autocomplete="off">
      <img class="login__logo" src="images/logo.jpg" alt="Estrada Hermanos" />
      <p class="login__brand">Estrada Hermanos</p>
      <p class="login__tag">Calzado Fino de Occidente</p>
      <p class="login__panel-label">Código de inicio de sesión</p>
      <div class="field">
        <label for="code">Código</label>
        <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" autofocus />
      </div>
      <p class="login__error" id="code-message" role="alert"></p>
      <button class="btn btn--primary btn--block" type="submit" id="code-submit">Ingresar al Panel</button>
      <p class="login__hint">Ingrese el código de 4 dígitos que recibió en su correo.</p>
      <a class="login__back" href="acceso.html">Volver al acceso</a>
    </form>
  </div>
  <script type="module" src="js/codigo.js"></script>
</body>
</html>
