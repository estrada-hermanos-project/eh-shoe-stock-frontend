<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estrada Hermanos | Panel de Gestión</title>
  <meta name="description" content="Panel de gestión de inventario, ventas y mercadería — Estrada Hermanos (prototipo)." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <!-- ============ LOGIN ============ -->
  <div class="login" id="login">
    <form class="login__card" id="login-form">
      <img class="login__logo" src="images/logo.jpg" alt="Estrada Hermanos" />
      <p class="login__brand">Estrada Hermanos</p>
      <p class="login__tag">Calzado Fino de Occidente</p>
      <p class="login__panel-label">Panel de gestión · Acceso propietarios</p>
      <div class="field">
        <label for="user">Usuario</label>
        <input type="text" id="user" value="propietario" autocomplete="username" />
      </div>
      <div class="field">
        <label for="pass">Contraseña</label>
        <input type="password" id="pass" value="estrada2026" autocomplete="current-password" />
      </div>
      <button class="btn btn--primary btn--block" type="submit">Ingresar al panel</button>
      <p class="login__hint">Prototipo de demostración — datos de ejemplo. Presione «Ingresar».</p>
    </form>
  </div>

  <!-- ============ APP ============ -->
  <div class="app" id="app" hidden>
    <div class="scrim" id="scrim" hidden></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <img src="images/logo.jpg" alt="" />
        <div>
          <div class="sidebar__brand-name">Estrada Hermanos</div>
          <div class="sidebar__brand-tag">Panel de gestión</div>
        </div>
      </div>
      <nav class="sidebar__nav" id="nav"><!-- links injected --></nav>
      <div class="sidebar__foot">
        <div class="sidebar__user">
          <div class="sidebar__avatar">EH</div>
          <div>
            <div class="sidebar__user-name">Propietario</div>
            <div class="sidebar__user-role">Administrador</div>
          </div>
        </div>
        <button class="btn btn--ghost btn--block btn--sm" id="logout" style="color:var(--gold-soft);border-color:rgba(184,149,106,.35)">Cerrar sesión</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="topbar__toggle" id="menu-toggle" aria-label="Menú"><span></span><span></span><span></span></button>
        <div class="topbar__titles">
          <div class="topbar__eyebrow" id="view-eyebrow">Resumen</div>
          <h1 class="topbar__title" id="view-title">Dashboard</h1>
        </div>
        <label class="topbar__search">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.7"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input type="search" id="global-search" placeholder="Buscar producto, código…" />
        </label>
      </header>

      <!-- Views -->
      <section class="view" data-view="dashboard" id="view-dashboard"></section>
      <section class="view" data-view="ventas" id="view-ventas" hidden></section>
      <section class="view" data-view="mercaderia" id="view-mercaderia" hidden></section>
      <section class="view" data-view="inventario" id="view-inventario" hidden></section>
      <section class="view" data-view="productos" id="view-productos" hidden></section>
    </div>
  </div>

  <!-- ============ MODAL ============ -->
  <div class="modal" id="modal" hidden>
    <div class="modal__scrim" data-close></div>
    <div class="modal__dialog" role="dialog" aria-modal="true">
      <div class="modal__head">
        <h2 class="modal__title" id="modal-title">Título</h2>
        <button class="modal__close" data-close aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__foot" id="modal-foot"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toast-wrap"></div>

  <script src="js/app.js"></script>
</body>
</html>
